name: Build & Auto-Release Android APK

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Buildozer SDK & NDK Only
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform
            .buildozer/android/platform
          key: buildozer-sdk-v4-${{ runner.os }}

      - name: Auto Increment Version & Set Permanent Keystore
        run: |
          NEW_VER="1.0.${{ github.run_number }}"
          NUM_VER="$((200 + ${{ github.run_number }}))"
          sed -i "s/^version = .*/version = $NEW_VER/" buildozer.spec
          sed -i "s/^android.numeric_version = .*/android.numeric_version = $NUM_VER/" buildozer.spec
          echo "NUM_VER=$NUM_VER" >> $GITHUB_ENV

          mkdir -p ~/.android
          cp -f my_fixed_debug.keystore ~/.android/debug.keystore

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev automake \
            libltdl-dev lld patch libsqlite3-dev apksigner

      - name: Install Pinned Buildozer & Cython
        run: |
          pip install "pip<24.0" "setuptools<69.0.0" "wheel<0.43.0"
          pip install "cython==0.29.36" "buildozer==1.5.0"

      - name: Force clean dist so new icon is used
        run: rm -rf .buildozer/android/platform/build-*/dists .buildozer/android/app

      - name: Build APK & Force Sign with Permanent Keystore
        run: |
          yes | buildozer android debug

          # APK তৈরি হওয়ার পর আমাদের স্থায়ী Keystore দিয়ে সরাসরি Force Sign করা
          for apk in bin/*.apk; do
            apksigner sign \
              --ks my_fixed_debug.keystore \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              "$apk"
            apksigner verify -v "$apk"
          done

      - name: Show icon inside APK
        run: |
          mkdir -p chk && cd chk
          unzip -o ../bin/*.apk res/mipmap/icon.png
          ls -l res/mipmap/icon.png ../assets/icon.png

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Machine-Tracker-APK
          path: bin/*.apk

      - name: Auto Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Smart Eng Logbook v1.0.${{ github.run_number }}"
          body: "Permanently Signed APK (Version Code: ${{ env.NUM_VER }}). Direct update supported without uninstalling."
          files: bin/*.apk
          draft: false
          prerelease: false
