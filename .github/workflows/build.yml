name: Build & Auto-Release Android APK

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Buildozer Directories
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev automake \
            libltdl-dev lld patch libsqlite3-dev

      - name: Install Pinned Buildozer & Cython
        run: |
          pip install "pip<24.0" "setuptools<69.0.0" "wheel<0.43.0"
          pip install "cython==0.29.36" "buildozer==1.5.0"

      - name: Accept Android Licenses & Build APK
        run: |
          yes | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Machine-Tracker-APK
          path: bin/*.apk

      - name: Auto Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Smart Eng Logbook v1.0.${{ github.run_number }}"
          body: "Automated Android APK Release built from commit ${{ github.sha }}"
          files: bin/*.apk
          draft: false
          prerelease: false
